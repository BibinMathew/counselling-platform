name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
          run_install: false
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - name: Start local Supabase
        run: |
          supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1 || {
            sed -E 's/(ANON_KEY|SERVICE_ROLE_KEY|SECRET_KEY|JWT_SECRET|PUBLISHABLE_KEY).*/\1=[REDACTED]/g' "$RUNNER_TEMP/supabase-start.log" | tail -n 40
            exit 1
          }
      - run: supabase db reset
      - run: pnpm test:integration
      - run: pnpm test:migrations
      - name: Configure local payment tests
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync} from 'node:fs';
          import {randomBytes} from 'node:crypto';
          const s=JSON.parse(execFileSync('supabase',['status','--output','json'],{encoding:'utf8',stdio:['ignore','pipe','ignore']}));
          const values={NEXT_PUBLIC_SUPABASE_URL:s.API_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:s.PUBLISHABLE_KEY,SUPABASE_SERVICE_ROLE_KEY:s.SERVICE_ROLE_KEY,PAYMENT_MODE:'simulator',PAYMENT_SIMULATOR_SECRET:randomBytes(32).toString('hex'),PAYMENT_RECONCILE_SECRET:randomBytes(32).toString('hex'),NOTIFICATION_MODE:'simulator',NOTIFICATION_APP_ORIGIN:'http://127.0.0.1:3000',NOTIFICATION_WORKER_SECRET:randomBytes(32).toString('hex')};
          for(const [key,value] of Object.entries(values)) {
            if(!value) throw new Error('Missing local test configuration: '+key);
            if(key.includes('SECRET')||key==='SUPABASE_SERVICE_ROLE_KEY') console.log('::add-mask::'+value);
            appendFileSync(process.env.GITHUB_ENV,`${key}=${value}\n`);
          }
          JS
      - run: pnpm exec playwright install --with-deps chromium
      # Browser fixtures share scheduling settings and global worker locks.
      # Race/concurrency scenarios remain explicit inside individual tests.
      - run: pnpm test:e2e --workers=1
      - run: pnpm build
        env:
          PAYMENT_MODE: disabled
          NOTIFICATION_MODE: disabled
